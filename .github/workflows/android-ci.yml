name: MofGram Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found on the runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          install_with_retry() {
            local package="$1"
            local attempt
            for attempt in 1 2 3; do
              echo "Installing $package (attempt $attempt/3)"
              if "$SDKMANAGER" --install "$package"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Installation failed; retrying after a short pause."
                sleep 10
              fi
            done
            echo "Could not install $package after 3 attempts."
            return 1
          }

          install_with_retry "platform-tools"
          install_with_retry "platforms;android-36"
          install_with_retry "build-tools;36.0.0"
          install_with_retry "cmake;3.22.1"
          install_with_retry "ndk;26.3.11579264"
          install_with_retry "ndk;27.2.12479018"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Validate Telegram API credentials
        shell: bash
        run: |
          if [[ ! "$TELEGRAM_API_ID" =~ ^[0-9]+$ ]] || [[ "$TELEGRAM_API_ID" == "0" ]]; then
            echo "TELEGRAM_API_ID is missing or invalid. Add it to GitHub Actions secrets."
            exit 1
          fi
          if [[ -z "$TELEGRAM_API_HASH" ]]; then
            echo "TELEGRAM_API_HASH is missing. Add it to GitHub Actions secrets."
            exit 1
          fi

      - name: Apply AyuGram TL compatibility patch
        run: python3 tools/ayugram/patch_tlrpc.py

      - name: Build MofGram standalone APK
        run: ./gradlew --no-daemon --stacktrace :TMessagesProj_AppStandalone:assembleAfatStandalone

      - name: Build regular MofGram release APK
        run: ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatRelease

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mofgram-android-apks
          path: |
            TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
            TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
